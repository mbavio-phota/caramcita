# Requisitos mínimos y zona de búsqueda.
min_bedrooms: 3
retention_days: 7          # cuánto se muestra un aviso después de desaparecer
zero_streak_alert: 2       # corridas seguidas con 0 resultados antes de avisar
request_delay_seconds: 3

# Localidades aceptadas. La clave es el nombre canónico; los alias se comparan
# sin acentos ni mayúsculas contra localidad, dirección, título y descripción.
localities:
  Alta Gracia:
    aliases: ["alta gracia"]
    barrios:
      - "el golf"
      - "villa camino real"
      - "camino real"
      - "parque virrey"
      - "villa oviedo"
      - "villa del golf"
      - "barrio norte"
      - "sabattini"
      - "cafferata"
      - "residencial sur"
      - "liniers"
      - "poluyan"
      - "los nogales"
      - "barrio cordoba"
      - "estacion del carmen"
      - "potrerillo de larreta"
      - "el potrerillo"
      - "villa parque"
      - "nuestra señora de lourdes"
      - "lourdes"
      - "santa teresa"
      - "carlos pellegrini"
      - "villa camiares"
      - "camiares"
      - "santa maria de alta gracia"
      - "la perla"
      - "pueyrredon"
      - "villa alto plaza"
      - "los paraisos"
      - "el crucero"
      - "solares de alta gracia"
      - "altos de alta gracia"
      - "tierra alta"
      - "ayres del potrerillo"
      - "villa golf"
  Falda del Carmen:
    aliases: ["falda del carmen"]
  Anisacate:
    aliases: ["anisacate"]
  Valle de Anisacate:
    aliases: ["valle de anisacate", "valle anisacate"]
  Villa La Bolsa:
    aliases: ["villa la bolsa", "la bolsa"]

# Localidades vecinas que NO entran, pero cuya mención descarta el aviso
# (evita que "a 10 km de Alta Gracia" cuente como Alta Gracia).
excluded_localities:
  - "potrero de garay"
  - "la serranita"
  - "villa ciudad de america"
  - "los aromos"
  - "villa los aromos"
  - "villa del prado"
