[project]
name = "caramcita"
version = "0.1.0"
description = "Buscador automático de casas en alquiler anual en Alta Gracia y alrededores"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "jinja2>=3.1",
  "pyyaml>=6",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.45"]

[project.scripts]
caramcita = "caramcita.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["caramcita*"]

[tool.setuptools.package-data]
caramcita = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
